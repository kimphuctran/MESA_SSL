name: HCLM frozen full-MultiRocket protocol smoke
on:
  push:
    branches: [hclm-fullbaseline-challenge-2026]
    paths: ['.github/workflows/hclm-full-mr-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install faithful aeon baseline
        run: |
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10' torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Restore original checked source
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/hclm_full_mr_challenge.py
      - name: Smoke-test exactly frozen support / classifier code
        run: |
          python -m MESA_SSL.hclm_full_mr_challenge --dataset ArrowHead --seed 5801 \
            --budgets 1 3 5 --kernels 336 --out results/ArrowHead_5801
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hclm-full-mr-smoke-ArrowHead
          path: results/ArrowHead_5801/
          retention-days: 30
