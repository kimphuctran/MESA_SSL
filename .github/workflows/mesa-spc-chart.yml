name: MESA-SPC split-calibrated T2 chart and SSL fallback
on:
  push:
    branches: [mesa-spc-chart-experiment-2026]
    paths: ['.github/workflows/mesa-spc-chart.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [GunPoint, ItalyPowerDemand, BasicMotions, Coffee, CBF, ECGFiveDays]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU execution environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Recover frozen upstream SSL experiment modules
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile bench_neuro_ssl.py mesa_mr_experiment.py MESA_SSL/mesa_spc_chart.py
      - name: Evaluate chart calibration, matched baselines and nuisance shift
        run: |
          python -m MESA_SSL.mesa_spc_chart --dataset "${{ matrix.dataset }}" \
            --seeds 801 802 --epochs 15 --budget 5 --alpha .10 \
            --out "results/${{ matrix.dataset }}"
      - name: Archive code, environment and outputs
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}"
          python -m pip freeze > "results/${{ matrix.dataset }}/requirements.txt"
          cp MESA_SSL/mesa_spc_chart.py "results/${{ matrix.dataset }}/source.py" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-spc-chart-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 30
