name: MESA shape-aware mechanism smoke and model ablation
on:
  push:
    branches: [mesa-shape-mechanism-2026]
    paths: ['.github/workflows/mesa-shape-mechanism-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset: [GunPoint, SyntheticControl]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Restore original source and inspect scientific invariants
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_dualpath_ssl.py
          python -c 'from MESA_SSL.mesa_dualpath_ssl import test_scientific_contract; assert test_scientific_contract()'
      - name: Compare mechanism and generic SSL at identical training budgets
        run: |
          python -m MESA_SSL.mesa_dualpath_ssl --dataset "${{ matrix.dataset }}" \
            --seeds 2602 --epochs 6 --hidden 24 --dim 48 \
            --out "results/${{ matrix.dataset }}"
      - name: Preserve full trial outputs and environment
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}"
          python -m pip freeze > "results/${{ matrix.dataset }}/requirements.txt"
          cp MESA_SSL/mesa_dualpath_ssl.py "results/${{ matrix.dataset }}/source.py" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-shape-mechanism-smoke-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}/
          retention-days: 30
