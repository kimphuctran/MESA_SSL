name: MESA ElasticSynapse HCLM-frozen independent few-shot validation
on:
  push:
    branches: [mesa-elastic-synaptic-memory-2026]
    paths: ['.github/workflows/mesa-elastic-independent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [CricketX, MedicalImages, Worms, Yoga]
        seed: [3801,3802]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce HCLM pretest frozen protocol and untouched source
        run: |
          python - <<'PY'
          import json, subprocess
          x=json.load(open('MESA_SSL/HCLM_ELASTIC_FROZEN_PROTOCOL_2026-11-24.json'))
          assert x['data_protocol']['independent_check_datasets']==[
            'CricketX','MedicalImages','Worms','Yoga']
          assert x['data_protocol']['seeds']==[3801,3802]
          assert x['data_protocol']['budgets']==[1,3,5]
          assert x['data_protocol']['no_test_label_or_test_feature_in_training_or_policy']
          assert x['oversight']['claim_absolute_win_forbidden'] if 'claim_absolute_win_forbidden' in x['oversight'] else x['performance_admissibility']['claim_absolute_win_forbidden']
          assert len(json.load(open('MESA_SSL/hclm_failure_ledger_2026-11-23.json')))>=16
          source=x['source_revision_before_test']
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','MESA_SSL/mesa_elastic_synaptic.py'],check=True)
          PY
          python MESA_SSL/hclm_search_governor.py --test-only
      - name: Install CPU scientific library and Numba
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10' 'numba>=0.61,<1'
      - name: Recover original verified MESA and dataset runner
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_elastic_synaptic.py
          python -c 'from MESA_SSL.mesa_elastic_synaptic import basic_synthetic_tests; assert basic_synthetic_tests()'
      - name: Matched 1/3/5-shot elastic memory and mechanism controls
        run: |
          python -m MESA_SSL.mesa_elastic_synaptic \
            --dataset "${{ matrix.dataset }}" --seeds "${{ matrix.seed }}" \
            --budgets 1 3 5 --epochs 8 --hidden 40 --dim 64 \
            --out "results/${{ matrix.dataset }}_${{ matrix.seed }}"
      - name: Save exact source and environment, even on failure
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}_${{ matrix.seed }}"
          cp MESA_SSL/mesa_elastic_synaptic.py "results/${{ matrix.dataset }}_${{ matrix.seed }}/source.py"
          cp MESA_SSL/HCLM_ELASTIC_FROZEN_PROTOCOL_2026-11-24.json "results/${{ matrix.dataset }}_${{ matrix.seed }}/frozen_contract.json"
          python -m pip freeze > "results/${{ matrix.dataset }}_${{ matrix.seed }}/requirements.txt"
          git rev-parse HEAD > "results/${{ matrix.dataset }}_${{ matrix.seed }}/source_commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-elastic-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/${{ matrix.dataset }}_${{ matrix.seed }}/
          retention-days: 30
