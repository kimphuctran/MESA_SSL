name: HCLM-authorized affine fallback independent 1-3-5 shot benchmark
on:
  push:
    branches: [hclm-affine-fallback-sandbox-2026]
    paths: ['.github/workflows/hclm-affine-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governed_experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [Strawberry, ToeSegmentation1, ToeSegmentation2, Computers]
        seed: [5601,5602]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HCLM GO / NO-GO gate — do not evaluate without permission
        run: |
          python MESA_SSL/hclm_search_governor.py --test-only
          python MESA_SSL/hclm_search_governor.py \
            --budget 5 --out "results/${{ matrix.dataset }}_${{ matrix.seed }}/governor"
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("MESA_SSL/HCLM_FROZEN_AFFINE_EXPERIMENT_2026-11-23.json")
          c=json.loads(f.read_text())
          assert c["scientifically_frozen_before_results"] is True
          assert c["governance"]["forbidden_actions"]==[
              "modify_master","deploy","claim_SOTA"]
          assert c["protocol"]["datasets"]==[
              "Strawberry","ToeSegmentation1","ToeSegmentation2","Computers"]
          assert c["protocol"]["seeds"]==[5601,5602]
          assert c["fixed_policy"]["chart_affine_conformal_p_cutoff"]==.05
          assert c["fixed_policy"]["chart_morphology_conformal_p_cutoff"]==.05
          for p in Path("results").glob("*/governor/governance_decision.json"):
              x=json.loads(p.read_text())
              assert x["governed_decision"]["action"]=="RUN_SANDBOX"
              assert x["governed_decision"]["next_experiment"]["id"]=="AFFINE_FALLBACK_CALIBRATION"
              assert not x["admissibility"]["admissible_for_promotion"]
          PY
      - name: Install fixed CPU environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Restore and verify upstream scientific code
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_biophysics_memory.py
          python -c 'from MESA_SSL.mesa_biophysics_memory import numerical_contracts; assert numerical_contracts()'
      - name: Evaluate frozen risk-controlled policy against matched alternatives
        run: |
          python -m MESA_SSL.mesa_biophysics_memory \
            --dataset "${{ matrix.dataset }}" --seeds "${{ matrix.seed }}" \
            --budgets 1 3 5 --epochs 8 --hidden 40 --dim 64 \
            --out "results/${{ matrix.dataset }}_${{ matrix.seed }}"
      - name: Archive independent experiment evidence
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}_${{ matrix.seed }}"
          python -m pip freeze > "results/${{ matrix.dataset }}_${{ matrix.seed }}/requirements.txt"
          cp MESA_SSL/mesa_biophysics_memory.py "results/${{ matrix.dataset }}_${{ matrix.seed }}/source.py"
          cp MESA_SSL/HCLM_FROZEN_AFFINE_EXPERIMENT_2026-11-23.json "results/${{ matrix.dataset }}_${{ matrix.seed }}/frozen_contract.json"
          git rev-parse HEAD > "results/${{ matrix.dataset }}_${{ matrix.seed }}/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hclm-frozen-affine-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/${{ matrix.dataset }}_${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
