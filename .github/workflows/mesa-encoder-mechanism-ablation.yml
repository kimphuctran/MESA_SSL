name: MESA encoder matched mechanism-loss counterfactual
on:
  push:
    branches: [mesa-encoder-hpo-2026]
    paths: ['.github/workflows/mesa-encoder-mechanism-ablation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [GunPoint, ItalyPowerDemand, BasicMotions, CBF, ECGFiveDays, SyntheticControl, Meat, GunPointAgeSpan]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experimental CPU environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10' 'optuna>=4.5,<5'
      - name: Check original code and selected parameters
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_encoder_hpo.py MESA_SSL/mesa_encoder_mechanism_ablation.py
      - name: Fixed-seed mechanism-on versus exact zero-mechanism-loss control
        run: |
          python -m MESA_SSL.mesa_encoder_mechanism_ablation \
            --dataset "${{ matrix.dataset }}" --seeds 1521 1522 --budget 5 \
            --config MESA_SSL/encoder_hpo_selected_2026-11-23.json \
            --out "results/${{ matrix.dataset }}"
      - name: Archive paired source and environment
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}"
          python -m pip freeze > "results/${{ matrix.dataset }}/requirements.txt"
          cp MESA_SSL/mesa_encoder_mechanism_ablation.py "results/${{ matrix.dataset }}/source.py" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-mechanism-counterfactual-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 30
