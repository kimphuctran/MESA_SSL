name: MESA-DP structural SSL: development and untouched UCR holdout
on:
  push:
    branches: [mesa-dualpath-structural-2026]
    paths: ['.github/workflows/mesa-dualpath-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [GunPoint, ItalyPowerDemand, BasicMotions, CBF, SyntheticControl, Wine, Fish, OSULeaf, Earthquakes]
        seed: [2601, 2602]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Restore original representation acquisition modules
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_dualpath_ssl.py
          python -c 'from MESA_SSL.mesa_dualpath_ssl import test_scientific_contract; assert test_scientific_contract()'
      - name: Fit matched dual-stream encoder and evaluate after TRAIN-only policy selection
        run: |
          python -m MESA_SSL.mesa_dualpath_ssl \
            --dataset "${{ matrix.dataset }}" --seeds "${{ matrix.seed }}" \
            --epochs 12 --hidden 40 --dim 64 --budget 5 \
            --out "results/${{ matrix.dataset }}_${{ matrix.seed }}"
      - name: Archive full outputs, environment, and evaluated source
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}_${{ matrix.seed }}"
          python -m pip freeze > "results/${{ matrix.dataset }}_${{ matrix.seed }}/requirements.txt"
          cp MESA_SSL/mesa_dualpath_ssl.py "results/${{ matrix.dataset }}_${{ matrix.seed }}/source.py" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-dualpath-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/${{ matrix.dataset }}_${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
