name: HCLM supplementary 10k MultiRocket for ineligible FaceFour
on:
  push:
    branches: [hclm-fullbaseline-challenge-2026]
    paths: ['.github/workflows/hclm-full-mr-supplement.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset: [Adiac]
        seed: [5801, 5802]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify only validity-driven amendment and provenance
        run: |
          python - <<'PY'
          import json
          j=json.load(open('MESA_SSL/HCLM_FULL_MR_DATA_ELIGIBILITY_AMENDMENT_2026-11-24.json'))
          assert j['invalid_dataset']=='FaceFour'
          assert j['new_supplementary_dataset']=='Adiac'
          assert j['original_trial_performance_used_for_selection'] is False
          assert j['kernels']==10000
          PY
      - name: Install fixed CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Restore verified original sources
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
      - name: Execute unchanged full MultiRocket baseline on declared supplement
        run: |
          python -m MESA_SSL.hclm_full_mr_challenge \
            --dataset "${{ matrix.dataset }}" --seed "${{ matrix.seed }}" \
            --budgets 1 3 5 --kernels 10000 \
            --out "results/${{ matrix.dataset }}_${{ matrix.seed }}"
      - name: Preserve all outcomes and amended contract
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}_${{ matrix.seed }}"
          cp MESA_SSL/HCLM_FULL_MR_DATA_ELIGIBILITY_AMENDMENT_2026-11-24.json "results/${{ matrix.dataset }}_${{ matrix.seed }}/amendment.json"
          cp MESA_SSL/hclm_full_mr_challenge.py "results/${{ matrix.dataset }}_${{ matrix.seed }}/source.py"
          python -m pip freeze > "results/${{ matrix.dataset }}_${{ matrix.seed }}/requirements.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mr10k-supplement-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/${{ matrix.dataset }}_${{ matrix.seed }}/
          retention-days: 30
