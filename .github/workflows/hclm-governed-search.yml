name: HCLM-governed research-search calibration and action gate
on:
  push:
    branches: [hclm-governed-research-search-2026]
    paths: ['.github/workflows/hclm-governed-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        budget: [1, 3, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and unit-test the governance process
        run: |
          python -m py_compile MESA_SSL/hclm_search_governor.py
          python MESA_SSL/hclm_search_governor.py --test-only
      - name: Audit prior independent evidence and select allowable next action
        run: |
          python MESA_SSL/hclm_search_governor.py \
            --archive MESA_SSL/riskgate_biophysics_holdout_2026-11-23.json \
            --ledger MESA_SSL/hclm_failure_ledger_2026-11-23.json \
            --budget "${{ matrix.budget }}" \
            --out "results/hclm_${{ matrix.budget }}shot"
      - name: Verify explicit governance restrictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('results').glob('hclm_*shot/governance_decision.json'):
              j=json.loads(p.read_text())
              assert j['governed_decision']['action']=='RUN_SANDBOX', j
              assert 'MERGE_MASTER' in j['governed_decision']['governed_controls']['forbidden']
              assert 'CLAIM_SOTA' in j['governed_decision']['governed_controls']['forbidden']
              assert len(j['failure_ledger'])>=12
              assert not j['admissibility']['admissible_for_promotion']
          PY
      - name: Save decision, provenance and source snapshot
        if: always()
        run: |
          mkdir -p "results/hclm_${{ matrix.budget }}shot"
          cp MESA_SSL/hclm_search_governor.py "results/hclm_${{ matrix.budget }}shot/source.py"
          cp MESA_SSL/hclm_failure_ledger_2026-11-23.json "results/hclm_${{ matrix.budget }}shot/failure_ledger.json"
          git rev-parse HEAD > "results/hclm_${{ matrix.budget }}shot/source_commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hclm-search-governor-${{ matrix.budget }}shot
          path: results/hclm_${{ matrix.budget }}shot/
          retention-days: 30
