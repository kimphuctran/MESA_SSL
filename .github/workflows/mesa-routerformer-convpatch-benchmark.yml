name: MESA ConvPatch RouterFormer full matched UCR validation
on:
  push:
    branches: [mesa-routerformer-convpatch-2026]
    paths: ['.github/workflows/mesa-routerformer-convpatch-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [Fish, GunPoint, SyntheticControl, PowerCons, BeetleFly, Herring, GunPointMaleVersusFemale]
        seed: [3601, 3602]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible CPU research dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10'
      - name: Restore and verify checked benchmark source
        run: |
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > mesa_mr_experiment.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          echo 'd269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  mesa_mr_experiment.py' | sha256sum -c -
          python -m py_compile MESA_SSL/mesa_routerformer.py
          python -c 'from MESA_SSL.mesa_routerformer import numerical_tests; assert numerical_tests()'
      - name: Train routed/local-global, dense Transformer, generic and CNN controls
        run: |
          python -m MESA_SSL.mesa_routerformer \
            --dataset "${{ matrix.dataset }}" --seeds "${{ matrix.seed }}" \
            --epochs 12 --dim 64 --depth 2 --budget 5 --cnn-baseline \
            --out "results/${{ matrix.dataset }}_${{ matrix.seed }}"
      - name: Preserve full training history, source and environment
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}_${{ matrix.seed }}"
          python -m pip freeze > "results/${{ matrix.dataset }}_${{ matrix.seed }}/requirements.txt"
          cp MESA_SSL/mesa_routerformer.py "results/${{ matrix.dataset }}_${{ matrix.seed }}/source.py" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-routerformer-${{ matrix.dataset }}-${{ matrix.seed }}
          path: results/${{ matrix.dataset }}_${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
